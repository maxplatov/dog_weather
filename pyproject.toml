[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dog-weather"
version = "0.1.0"
description = "Telegram weather forecast bot with multi-provider consensus"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.0",
    "timezonefinder>=6.5",
    "PyYAML>=6.0",
    "pytz>=2024.1",
]

[project.scripts]
dog-weather = "dog_weather.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dog_weather"]
